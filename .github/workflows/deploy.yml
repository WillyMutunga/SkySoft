name: Deploy SkySoft Systems to HostPinnacle via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build, Package ZIP & Fast FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, fileinfo, curl, json, zip
          coverage: none

      - name: Setup Environment File & Database
        run: |
          cp .env.example .env || true
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env || true
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env || true
          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env || true
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env || true
          sed -i 's|APP_URL=.*|APP_URL=https://skysoftsystems.co.ke|' .env || true

      - name: Install PHP Dependencies
        run: |
          composer config --global policy.advisories.block false || true
          composer config policy.advisories.block false || true
          composer config audit.abandoned ignore || true
          composer update --no-scripts --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

      - name: Bootstrap Laravel, Run Migrations & Seeders
        run: |
          php artisan key:generate --force
          php artisan package:discover --ansi || true
          php artisan migrate --force
          php artisan db:seed --force
          php artisan config:clear || true
          php artisan route:clear || true
          php artisan view:clear || true

      - name: Create Fast ZIP Bundle
        run: |
          mkdir -p deploy_dist
          zip -r deploy_dist/skysoft_app.zip . -x ".git*" "deploy_dist*" "node_modules*" "tests*" "README.md" "database/database.sqlite" "public/uploads/*"
          cp unzip.php deploy_dist/

      - name: Deploy ZIP Bundle to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: /

      - name: Trigger Server-Side ZIP Extraction
        run: |
          curl -s -k "https://skysoftsystems.co.ke/unzip.php" || true
