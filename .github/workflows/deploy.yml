name: Deploy to HostPinnacle via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Sync React Frontend to HostPinnacle
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./

    - name: Sync Django Backend Payload to HostPinnacle
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: ./backend_payload/
        exclude: |
          **/.git*
          **/.git*/**
          db.sqlite3
          venv/**
          __pycache__/**

    - name: Move Backend Files via PHP and Restart App
      run: |
        echo "Triggering PHP script to move backend payload to /backend_app/"
        curl -f -s https://skysoftsystems.co.ke/deploy_backend.php || echo "Failed to trigger deploy_backend.php"
