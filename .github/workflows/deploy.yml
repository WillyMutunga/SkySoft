name: Deploy to HostPinnacle via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build

    - name: Prepare Deployment Package
      run: |
        zip -r dist/backend.zip backend/*
        cp public/deploy_backend.php dist/
      
    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /
        exclude: |
          **/.git*
          **/.git*/**

    - name: Trigger Backend Deployment
      run: |
        echo "Triggering PHP script to deploy backend..."
        curl -f -s https://skysoftsystems.co.ke/deploy_backend.php || echo "Failed to trigger deploy_backend.php"
